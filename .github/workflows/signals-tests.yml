name: Signals engine tests

on:
  push:
    paths: ["signals/**", ".github/workflows/signals-tests.yml"]
  pull_request:
    paths: ["signals/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
